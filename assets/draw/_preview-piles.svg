<style>
  /* Each stage arrives in construction order: the cages lower into the open
     excavations, the formwork boxes up around them, the stripped caps settle
     last. Transform and opacity only, so it composites rather than relayouts. */
  .cage, .form, .cast { transform-box: fill-box; }
  .cage { animation: lower 1500ms cubic-bezier(.22,1,.32,1) both; }
  .form { animation: rise  1100ms cubic-bezier(.22,1,.32,1) both; }
  .cast { animation: rise   900ms cubic-bezier(.22,1,.32,1) both; }
  #cage-0 { animation-delay: 120ms }  #cage-1 { animation-delay: 300ms }
  #form-0 { animation-delay: 760ms }  #form-1 { animation-delay: 900ms }  #form-2 { animation-delay: 1040ms }
  #cast-0 { animation-delay: 1420ms } #cast-1 { animation-delay: 1560ms }
  @keyframes lower { from { transform: translateY(-120px); opacity: 0 } to { transform: none; opacity: 1 } }
  @keyframes rise  { from { transform: translateY(26px);   opacity: 0 } to { transform: none; opacity: 1 } }
  @media (prefers-reduced-motion: reduce) {
    .cage, .form, .cast { animation: none; opacity: 1; transform: none; }
  }
</style>
